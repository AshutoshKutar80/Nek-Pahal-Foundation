<!DOCTYPE html>
<html lang="hi" data-th="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nek Pahal Foundation</title>
  <link rel="icon" href="web/fevi.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #fffaf1;
      --band: #eef3ff;
      --card: #fff;
      --h: #12296b;
      --mut: #5b6272;
      --inp: #fbfcff;
      --bd: #c9d3ee;
      --hd: #ffffffee;
      --ft: #0d1f52;
      --g1: #12296b;
      --g2: #1d4fc4;
      --navy: #12296b;
      --blue: #1d4fc4;
      --saf: #f28a1d;
      --grn: #2e8b2e;
      --red: #c8181f;
      --cream: #fffaf1;
      --ink: #1c2233;
      --tri: linear-gradient(90deg, #f28a1d, #fff 50%, #2e8b2e)
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 70px
    }

    body {
      font-family: "Noto Sans Devanagari", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;
      overflow-x: hidden
    }

    img {
      max-width: 100%;
      display: block
    }

    h1,
    h2,
    h3,
    .brand span,
    .stats b {
      font-family: "Baloo 2", "Noto Sans Devanagari", sans-serif
    }

    a {
      color: inherit
    }

    /* header */
    .top {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: var(--hd);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 14px #12296b1a
    }

    .top::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: var(--tri)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--h);
      font-weight: 800;
      font-size: 1.1rem
    }

    .brand img {
      width: 40px;
      height: 40px;
      border-radius: 10px
    }

    .burger {
      border: 0;
      background: var(--navy);
      color: #fff;
      font-size: 1.3rem;
      border-radius: 10px;
      width: 42px;
      height: 38px;
      cursor: pointer
    }

    #menu {
      display: none;
      width: 100%;
      flex-direction: column;
      padding: 8px 0 4px
    }

    #menu.open {
      display: flex
    }

    #menu a {
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      color: var(--h)
    }

    #menu a.on {
      background: var(--saf);
      color: #fff
    }

    /* hero */
    .hero {
      position: relative;
      text-align: center;
      padding: 34px 16px 70px;
      color: #fff;
      background:
        radial-gradient(circle at 15% 20%, #f28a1d55 0, transparent 40%),
        radial-gradient(circle at 85% 80%, #2e8b2e66 0, transparent 45%),
        linear-gradient(160deg, var(--g1), var(--g2));
      overflow: hidden
    }

    .hero::after {
      content: "";
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: -1px;
      height: 46px;
      background: var(--bg);
      border-radius: 50% 50% 0 0/100% 100% 0 0
    }

    .hero-card {
      background: #fff;
      border-radius: 26px;
      padding: 14px;
      width: min(320px, 82%);
      margin: 0 auto 20px;
      box-shadow: 0 18px 40px #0005;
      animation: pop .8s cubic-bezier(.2, .9, .3, 1.2) both
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(26px) scale(.93)
      }
    }

    .hero h1 {
      font-size: 1.65rem;
      line-height: 1.35;
      max-width: 560px;
      margin: 0 auto 18px;
      text-shadow: 0 2px 8px #0004
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center
    }

    .btn {
      display: inline-block;
      background: var(--saf);
      color: #fff;
      font: 700 1rem "Noto Sans Devanagari", sans-serif;
      text-decoration: none;
      border: 0;
      border-radius: 99px;
      padding: 12px 26px;
      cursor: pointer;
      box-shadow: 0 6px 16px #f28a1d66;
      transition: transform .15s
    }

    .btn:hover {
      transform: translateY(-2px)
    }

    .btn.w {
      background: var(--card);
      color: var(--h);
      box-shadow: 0 6px 16px #0003
    }

    .btn.n {
      background: var(--navy);
      box-shadow: 0 6px 16px #12296b55
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 620px;
      margin: -38px auto 0;
      padding: 0 14px;
      position: relative;
      z-index: 5
    }

    .stats div {
      background: var(--card);
      border-radius: 16px;
      padding: 12px 4px;
      text-align: center;
      box-shadow: 0 8px 22px #12296b26;
      border-bottom: 4px solid var(--saf)
    }

    .stats div:nth-child(2) {
      border-color: var(--h)
    }

    .stats div:nth-child(3) {
      border-color: var(--grn)
    }

    .stats b {
      display: block;
      font-size: 1.45rem;
      color: var(--h);
      line-height: 1.2
    }

    .stats span {
      font-size: .8rem;
      color: var(--mut)
    }

    /* sections */
    .sec {
      padding: 52px 14px 24px;
      max-width: 1100px;
      margin: 0 auto
    }

    .band {
      max-width: none;
      background: var(--band);
      padding-bottom: 44px;
      margin-top: 28px
    }

    .band>* {
      max-width: 1072px;
      margin-left: auto;
      margin-right: auto
    }

    .narrow {
      max-width: 760px
    }

    h2 {
      font-size: 1.9rem;
      color: var(--h);
      text-align: center;
      line-height: 1.3
    }

    h2::after {
      content: "";
      display: block;
      width: 84px;
      height: 5px;
      margin: 6px auto 0;
      border-radius: 9px;
      background: var(--tri);
      border: 1px solid #e3e3e3
    }

    .sub {
      text-align: center;
      color: var(--mut);
      margin: 12px 0 26px
    }

    .t {
      margin-bottom: 12px
    }

    .cols {
      display: grid;
      gap: 14px;
      grid-template-columns: 1fr 1fr
    }

    .box {
      background: var(--card);
      border-radius: 20px;
      padding: 18px 14px;
      box-shadow: 0 6px 20px #12296b1a;
      border-top: 5px solid var(--saf);
      transition: transform .2s
    }

    .box:hover {
      transform: translateY(-4px)
    }

    .box:nth-child(3n+2) {
      border-color: var(--h)
    }

    .box:nth-child(3n) {
      border-color: var(--grn)
    }

    .box h3 {
      color: var(--h);
      font-size: 1.08rem
    }

    .box p {
      font-size: .9rem;
      color: var(--mut)
    }

    .ic {
      font-size: 2rem;
      line-height: 1.2
    }

    .cols.v3 {
      grid-template-columns: repeat(3, 1fr);
      text-align: center
    }

    /* slider */
    .slider-wrap {
      position: relative
    }

    .slider {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      padding: 6px 2px 16px
    }

    .slider::-webkit-scrollbar {
      display: none
    }

    .donor {
      flex: 0 0 74%;
      scroll-snap-align: center;
      background: var(--card);
      border-radius: 24px;
      padding: 14px 14px 18px;
      text-align: center;
      box-shadow: 0 10px 26px #12296b24;
      position: relative;
      overflow: hidden
    }

    .donor::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 78px;
      background: linear-gradient(120deg, var(--saf), var(--navy))
    }

    .donor .ph {
      position: relative;
      width: 128px;
      height: 128px;
      margin: 6px auto 10px;
      border-radius: 50%;
      border: 5px solid var(--card);
      overflow: hidden;
      background: #eee;
      box-shadow: 0 6px 16px #0003
    }

    .donor img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .donor h3 {
      color: var(--h);
      font-size: 1.15rem
    }

    .amt {
      display: inline-block;
      margin: 6px 0 2px;
      background: linear-gradient(120deg, #2e8b2e, #47b347);
      color: #fff;
      font: 700 1.1rem "Baloo 2";
      padding: 2px 18px;
      border-radius: 99px
    }

    .donor small {
      display: block;
      color: var(--mut)
    }

    .nav {
      position: absolute;
      top: 44%;
      z-index: 5;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      font-size: 1.6rem;
      line-height: 1;
      box-shadow: 0 4px 12px #0004;
      cursor: pointer;
      display: none
    }

    .prev {
      left: -8px
    }

    .next {
      right: -8px
    }

    /* distribute */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px
    }

    .dist {
      background: var(--card);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 24px #12296b1f;
      transition: transform .2s
    }

    .dist:hover {
      transform: translateY(-4px)
    }

    .dist .ph {
      position: relative;
      aspect-ratio: 16/10;
      background: #e5e5e5
    }

    .dist .ph img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .dist .pin {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: var(--red);
      color: #fff;
      font-size: .82rem;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 99px;
      box-shadow: 0 3px 10px #0005
    }

    .dist .info {
      padding: 14px 16px 16px
    }

    .dist h3 {
      color: var(--h);
      font-size: 1.2rem
    }

    .dist p {
      margin: 2px 0 6px;
      font-size: .93rem
    }

    .dist small {
      color: var(--mut)
    }

    /* gallery */
    .gal {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px
    }

    .g {
      aspect-ratio: 1/1;
      border-radius: 16px;
      overflow: hidden;
      background: #eee;
      box-shadow: 0 4px 12px #12296b1a
    }

    .g:nth-child(5n+1) {
      grid-column: span 2;
      aspect-ratio: 2/1
    }

    .g img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s
    }

    .g:hover img {
      transform: scale(1.08)
    }

    /* forms */
    form.f {
      display: grid;
      gap: 12px;
      background: var(--card);
      padding: 18px;
      border-radius: 20px;
      box-shadow: 0 8px 24px #12296b1a;
      text-align: left
    }

    form.f label {
      font-weight: 600;
      color: var(--h);
      font-size: .92rem
    }

    form.f input,
    form.f select,
    form.f textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--bd);
      border-radius: 12px;
      font: inherit;
      background: var(--inp);
      margin-top: 3px
    }

    form.f :focus {
      outline: 2px solid var(--saf);
      border-color: var(--saf)
    }

    /* donate */
    .don {
      background: linear-gradient(160deg, var(--g1), var(--g2));
      max-width: none;
      margin-top: 40px;
      padding-bottom: 50px;
      text-align: center;
      color: #fff
    }

    .don>* {
      max-width: 560px;
      margin-left: auto;
      margin-right: auto
    }

    .don h2 {
      color: #fff
    }

    .don .sub {
      color: #d6e0ff
    }

    .upi-box {
      background: var(--card);
      color: var(--ink);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 14px 34px #0005
    }

    .upi-box h3 {
      color: var(--h)
    }

    .upi {
      font: 700 1.45rem "Baloo 2", monospace;
      color: var(--grn);
      word-break: break-all
    }

    .qr {
      max-width: 200px;
      margin: 10px auto
    }

    .don .t {
      margin: 18px auto 14px;
      color: #e6ecff
    }

    /* footer */
    footer {
      background: var(--ft);
      color: #cfd8f5;
      text-align: center;
      padding: 26px 12px 90px
    }

    footer img {
      margin: 0 auto 14px;
      width: 100%;
      max-width: 980px;
      border-radius: 12px
    }

    .fl {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 16px;
      margin-bottom: 10px
    }

    .fl a {
      text-decoration: none;
      font-size: .9rem
    }

    footer p {
      font-size: .85rem;
      opacity: .8
    }

    /* social + developer credit */
    .social {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 6px 0 14px
    }

    .social a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: .92rem;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      padding: 8px 18px;
      border-radius: 99px;
      box-shadow: 0 4px 14px #0004;
      transition: transform .2s
    }

    .social a:hover {
      transform: translateY(-2px)
    }

    .dev-credit {
      margin-top: 14px;
      font-size: .8rem;
      opacity: .85
    }

    .dev-credit a {
      color: #ffd28a;
      text-decoration: none;
      font-weight: 600
    }

    .dev-credit a:hover {
      text-decoration: underline
    }

    /* floating button (mobile) */
    .fab {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 40;
      background: var(--red);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 99px;
      box-shadow: 0 8px 22px #c8181f77
    }

    /* lightbox */
    .cnt {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: #000b;
      color: #fff;
      font-size: .82rem;
      padding: 3px 12px;
      border-radius: 99px
    }

    .dist .ph,
    .g {
      cursor: pointer
    }

    #lb {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000e;
      display: flex;
      flex-direction: column
    }

    #lb[hidden] {
      display: none
    }

    .lbs {
      flex: 1;
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none
    }

    .lbs::-webkit-scrollbar {
      display: none
    }

    .sl {
      flex: 0 0 100%;
      scroll-snap-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 58px 8px 6px;
      min-height: 0
    }

    .sl img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px
    }

    .lbc {
      color: #fff;
      text-align: center;
      padding: 10px 10px 18px;
      font-weight: 600
    }

    .lb-b {
      position: absolute;
      z-index: 2;
      border: 0;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      background: var(--card);
      color: var(--h);
      font-size: 1.5rem;
      cursor: pointer
    }

    .lb-x {
      top: 10px;
      right: 12px
    }

    .lb-p,
    .lb-n {
      top: 50%;
      display: none
    }

    .lb-p {
      left: 12px
    }

    .lb-n {
      right: 12px
    }

    @media(min-width:600px) {
      .donor {
        flex-basis: calc(50% - 8px)
      }

      .grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .nav {
        display: block
      }

      .cols {
        grid-template-columns: repeat(3, 1fr)
      }

      .hero h1 {
        font-size: 2.1rem
      }

      h2 {
        font-size: 2.3rem
      }
    }

    @media(min-width:900px) {
      .burger {
        display: none
      }

      #menu {
        display: flex;
        flex-direction: row;
        width: auto;
        padding: 0;
        gap: 2px
      }

      #menu a {
        padding: 6px 10px;
        font-size: .9rem
      }

      .donor {
        flex-basis: calc(25% - 12px)
      }

      .grid {
        grid-template-columns: repeat(3, 1fr)
      }

      .gal {
        grid-template-columns: repeat(4, 1fr)
      }

      .lb-p,
      .lb-n {
        display: block
      }

      .fab {
        display: none
      }

      footer {
        padding-bottom: 26px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important
      }
    }

    /* themes */
    html[data-th=dark] {
      --bg: #0c1224;
      --band: #111a33;
      --card: #172142;
      --h: #a9c1ff;
      --ink: #e8ecfa;
      --mut: #a3adc9;
      --inp: #0f1830;
      --bd: #2b3a6b;
      --hd: #0c1224ee;
      --ft: #070c1b;
      --g1: #0a1840;
      --g2: #1a3a9a
    }

    html[data-th=kesari] {
      --bg: #fff3de;
      --band: #ffe2b0;
      --card: #fffaf0;
      --h: #8a3b00;
      --ink: #3a2410;
      --mut: #7a5a3a;
      --inp: #fffdf6;
      --bd: #f0c58a;
      --hd: #fff3deee;
      --ft: #5a2a00;
      --g1: #e8741a;
      --g2: #f7a940
    }

    body,
    .top,
    .box,
    .donor,
    .dist,
    form.f,
    .band,
    .stats div,
    footer {
      transition: background-color .45s, color .45s, border-color .45s
    }

    /* controls */
    .ctl {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      margin-right: 8px
    }

    .lg {
      display: flex;
      background: var(--band);
      border-radius: 99px;
      padding: 3px
    }

    .lg button,
    #th {
      border: 0;
      font: 600 .78rem "Noto Sans Devanagari", sans-serif;
      color: var(--h);
      background: none;
      border-radius: 99px;
      padding: 5px 9px;
      cursor: pointer;
      transition: background .25s, color .25s
    }

    .lg button.on {
      background: var(--saf);
      color: #fff
    }

    #th {
      background: var(--band);
      font-size: 1.05rem;
      padding: 4px 9px
    }

    #menu {
      order: 5
    }

    .brand span {
      max-width: 34vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    #prog {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      z-index: 90;
      background: var(--tri);
      transform: scaleX(0);
      transform-origin: 0 50%
    }

    /* motion */
    .rv {
      opacity: 0;
      transform: translateY(26px)
    }

    .rv.in {
      opacity: 1;
      transform: none;
      transition: opacity .7s var(--d, 0ms), transform .3s
    }

    .box.rv.in:hover,
    .dist.rv.in:hover {
      transform: translateY(-5px)
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(8px);
      opacity: .5;
      animation: fl 9s ease-in-out infinite
    }

    .b1 {
      width: 150px;
      height: 150px;
      left: -40px;
      top: 70px;
      background: var(--saf)
    }

    .b2 {
      width: 190px;
      height: 190px;
      right: -60px;
      bottom: 50px;
      background: var(--grn);
      animation-delay: -4s
    }

    @keyframes fl {
      50% {
        transform: translate(18px, -26px) scale(1.08)
      }
    }

    .hero-card {
      animation: pop .8s cubic-bezier(.2, .9, .3, 1.2) both, bob 5s 1s ease-in-out infinite
    }

    @keyframes bob {
      50% {
        transform: translateY(-8px)
      }
    }

    .hero h1,
    .hero .row {
      position: relative;
      animation: up .8s .35s both
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(18px)
      }
    }

    .btn {
      position: relative;
      overflow: hidden
    }

    .btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: -70%;
      width: 50%;
      height: 100%;
      background: #fff6;
      transform: skewX(-20deg);
      transition: left .6s
    }

    <script>
      const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const LS = { get: k => { try { return localStorage.getItem(k) } catch { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch { } } };
      const THEMES = ["light", "dark", "kesari"], ICONS = ["☀️", "🌙", "🪔"];
      let lang = +(LS.get("lang") || 0), th = THEMES.indexOf(LS.get("th")); if (th < 0) th = matchMedia("(prefers-color-scheme: dark)").matches ? 1 : 0;
      const L = v => Array.isArray(v) ? (v[lang] ?? v[0]) : v;
      const fmt = n => "₹" + Number(n).toLocaleString("en-IN");
      const fdate = s => new Date(s).toLocaleDateString(lang === 0 ? "hi-IN" : "en-IN", { day: "numeric", month: "long", year: "numeric" });
      const img = (s, a) => `<img src="${s}" alt="${a}" loading="lazy" onerror="this.onerror=null;this.src='web/logo.png';this.style.objectFit='contain'">`;

      /* ---- albums ---- */
      const probe = s => new Promise(r => { const i = new Image(); i.onload = () => r(s); i.onerror = () => r(null); i.src = s; });
      const photosOf = d => Promise.all(Array.from({ length: d.count || 1 }, (_, i) => probe(`${d.folder}/${d.prefix}${i + 1}.png`))).then(a => a.filter(Boolean));
      let ALB = [], flt = -1, counted = false;
      const DI = () => ALB.filter(a => a.folder === "distribute");
      const flat = () => ALB.flatMap((a, ai) => (flt < 0 || flt === ai) ? a.photos.map(src => ({ src, cap: L(a.title) + (a.location ? " · " + L(a.location) : "") })) : []);

      /* ---- lightbox ---- */
      const lb = $("#lb"), lbs = $(".lbs", lb), lbc = $(".lbc", lb); let cur = [];
      const cap = () => { const i = Math.round(lbs.scrollLeft / lbs.clientWidth); lbc.textContent = cur[i] ? `${cur[i].cap} · ${i + 1}/${cur.length}` : ""; };
      function openLB(list, i) {
        cur = list; lbs.innerHTML = list.map(p => `<div class="sl"><img src="${p.src}" alt="${p.cap}"></div>`).join("");
        lb.hidden = false; document.body.style.overflow = "hidden";
        lbs.style.scrollBehavior = "auto"; lbs.scrollLeft = lbs.clientWidth * i; lbs.style.scrollBehavior = ""; cap();
      }
      const closeLB = () => { lb.hidden = true; document.body.style.overflow = ""; };
      const go = n => lbs.scrollBy({ left: n * lbs.clientWidth, behavior: "smooth" });
      lbs.addEventListener("scroll", cap); $(".lb-x").onclick = closeLB; $(".lb-p").onclick = () => go(-1); $(".lb-n").onclick = () => go(1);
      addEventListener("keydown", e => { if (lb.hidden) return; if (e.key === "Escape") closeLB(); if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });

      /* ---- render ---- */
      const count = el => { const n = +el.dataset.n, t0 = performance.now(); (function f(t) { const p = Math.min((t - t0) / 1300, 1); el.textContent = (el.dataset.p || "") + Math.round(n * (1 - Math.pow(1 - p, 3))).toLocaleString("en-IN"); if (p < 1) requestAnimationFrame(f); })(t0); };
      function render() {
        const total = DONORS.reduce((s, d) => s + +d.amount, 0);
        $("#stats").innerHTML = [[total, "₹", "stA"], [DONORS.length, "", "stB"], [DISTS.length, "", "stC"]].map(([n, p, k]) => `<div><b data-n="${n}" data-p="${p}">${p}${n.toLocaleString("en-IN")}</b><span>${T[k][lang]}</span></div>`).join("");
        if (!counted) { const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { counted = true; io.disconnect(); $$("#stats b").forEach(count); } }); io.observe($("#stats")); }
        $("#slider").innerHTML = DONORS.map(d => `<article class="donor"><div class="ph">${img(d.image, d.name)}</div><h3>${L(d.name)}</h3><span class="amt">${fmt(d.amount)}</span><small>${fdate(d.date)}</small></article>`).join("");
        $("#dist").innerHTML = DI().map((d, i) => `<article class="dist"><div class="ph" data-i="${i}">${img(d.photos[0] || "web/logo.png", L(d.title))}<span class="pin">📍 ${L(d.location)}</span>${d.photos.length > 1 ? `<span class="cnt">📷 ${d.photos.length}</span>` : ""}</div><div class="info"><h3>${L(d.title)}</h3><p>${L(d.desc)}</p><small>${fdate(d.date)}</small></div></article>`).join("");
        $("#chips").innerHTML = [`<button class="chip${flt < 0 ? " on" : ""}" data-f="-1">${T.all[lang]}</button>`, ...ALB.map((a, i) => a.photos.length ? `<button class="chip${flt === i ? " on" : ""}" data-f="${i}">${L(a.title)}${a.location ? " · " + L(a.location).split(",")[0] : ""}</button>` : "")].join("");
        $("#gal").innerHTML = flat().map((p, i) => `<div class="g" data-i="${i}">${img(p.src, p.cap)}</div>`).join("");
        reveal();
      }
      let rio; function reveal() {
        rio = rio || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); rio.unobserve(e.target); } }), { threshold: .12 });
        $$(".sec h2,.sub,.box,.dist,.g,.stats div,.upi-box,form.f").filter(e => !e.classList.contains("rv")).forEach((e, i) => { e.classList.add("rv"); e.style.setProperty("--d", (i % 6) * 70 + "ms"); rio.observe(e); });
      }

      /* ---- language + theme ---- */
      const link = ([f, t]) => `<a href="#${f}">${L(t)}</a>`;
      function setLang(n) {
        lang = n; LS.set("lang", n); document.documentElement.lang = ["hi", "en", "hi-Latn"][n];
        $$("[data-t]").forEach(e => { if (T[e.dataset.t]) e.innerHTML = T[e.dataset.t][lang]; });
        $("#menu").innerHTML = NAV.map(link).join(""); $("#flinks").innerHTML = NAV.map(link).join("");
        $$(".lg button").forEach(b => b.classList.toggle("on", +b.dataset.l === lang));
        document.title = T.brand[lang]; $("#upiId").textContent = UPI;
        $("#qrUpi").textContent = UPI;
        render(); spy();
      }
      const setTh = n => { th = n; LS.set("th", THEMES[n]); document.documentElement.dataset.th = THEMES[n]; $("#th").textContent = ICONS[n]; };
      $$(".lg button").forEach(b => b.onclick = () => setLang(+b.dataset.l));
      $("#th").onclick = () => setTh((th + 1) % 3);
      $("#yr").textContent = new Date().getFullYear();

      /* ---- menu, scroll spy, progress ---- */
      const burger = $(".burger"), menu = $("#menu");
      burger.onclick = () => burger.setAttribute("aria-expanded", menu.classList.toggle("open"));
      menu.onclick = e => { if (e.target.tagName === "A") { menu.classList.remove("open"); burger.setAttribute("aria-expanded", "false"); } };
      let spyIO; function spy() {
        spyIO = spyIO || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) $$("#menu a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-45% 0px -50% 0px" });
        $$("main section").forEach(s => spyIO.observe(s));
      }
      addEventListener("scroll", () => $("#prog").style.transform = `scaleX(${scrollY / (document.documentElement.scrollHeight - innerHeight || 1)})`, { passive: true });

      /* ---- clicks ---- */
      document.addEventListener("click", e => {
        const c = e.target.closest(".chip"); if (c) { flt = +c.dataset.f; render(); return; }
        const g = e.target.closest(".g"); if (g) return openLB(flat(), +g.dataset.i);
        const p = e.target.closest(".dist .ph"); if (p) { const d = DI()[+p.dataset.i]; if (d.photos.length) openLB(d.photos.map(src => ({ src, cap: L(d.title) + " · " + L(d.location) })), 0); }
      });

      /* ---- slider ---- */
      const sl = $("#slider"), step = () => (sl.querySelector(".donor")?.offsetWidth || 250) + 16;
      $$(".nav").forEach(b => b.onclick = () => sl.scrollBy({ left: b.classList.contains("next") ? step() : -step(), behavior: "smooth" }));
      let paused = false;
      ["pointerdown", "mouseenter"].forEach(e => sl.addEventListener(e, () => paused = true));
      ["pointerup", "mouseleave"].forEach(e => sl.addEventListener(e, () => setTimeout(() => paused = false, 2500)));
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(() => { if (paused) return; sl.scrollLeft + sl.clientWidth >= sl.scrollWidth - 5 ? sl.scrollTo({ left: 0, behavior: "smooth" }) : sl.scrollBy({ left: step(), behavior: "smooth" }); }, 3000);

      /* ---- forms + copy ---- */
      $$("form[data-wa]").forEach(f => f.onsubmit = e => { e.preventDefault(); const t = [...f.elements].filter(x => x.name && x.value).map(x => `${x.name}: ${x.value}`).join("\n"); open(`https://wa.me/${PHONE}?text=${encodeURIComponent(f.dataset.wa + "\n" + t)}`, "_blank"); });
      $("#copyUpi").onclick = () => navigator.clipboard.writeText(UPI).then(() => { $("#copyUpi").textContent = T.copied[lang]; setTimeout(() => $("#copyUpi").textContent = T.copy[lang], 2000); });
      $("#qrUpi").textContent = UPI;
      $("#qrCopy").onclick = () => navigator.clipboard.writeText(UPI).then(() => {
        $("#qrCopy").textContent = T.copied[lang];
        setTimeout(() => $("#qrCopy").textContent = T.copy[lang], 2000);
      });

      /* ---- DONATION POPUP ---- */
      (function initDonPopup() {
        const pop = $("#donPop");
        const popUpi = $("#popUpi");
        const popCopy = $("#popCopy");
        const popGo = $("#popGo");
        const popSkip = $("#popSkip");
        const popX = $(".don-pop-x");
        if (!pop) return;
        popUpi.textContent = UPI;
        const KEY = "donPopDismissed";
        const last = +LS.get(KEY) || 0;
        const H24 = 24 * 60 * 60 * 1000;
        if (Date.now() - last > H24) {
          setTimeout(() => { pop.hidden = false; document.body.style.overflow = "hidden"; }, 1500);
        }
        const close = (remember) => {
          pop.hidden = true;
          document.body.style.overflow = "";
          if (remember) LS.set(KEY, Date.now());
        };
        popX.onclick = () => close(true);
        popSkip.onclick = () => close(true);
        pop.addEventListener("click", e => { if (e.target === pop) close(true); });
        popGo.addEventListener("click", () => close(false));
        popCopy.onclick = () => navigator.clipboard.writeText(UPI).then(() => {
          popCopy.textContent = "✓";
          popCopy.classList.add("done");
          setTimeout(() => { popCopy.textContent = "📋"; popCopy.classList.remove("done"); }, 1600);
        });
        addEventListener("keydown", e => { if (!pop.hidden && e.key === "Escape") close(true); });
      })();

      /* ---- start ---- */
      setTh(th); setLang(lang);
      (async () => {
        ALB = await Promise.all([...DISTS.map(d => ({ ...d, folder: "distribute" })), ...GALLERY.map(d => ({ ...d, folder: "gallery" }))].map(async d => ({ ...d, photos: await photosOf(d) })));
        render();
      })();
    </script>
  </body>
  
  </html>
